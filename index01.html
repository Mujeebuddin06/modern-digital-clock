<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Digital Clock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style01.css">
</head>
<body>
  <main class="clock">
    <p class="clock__date" id="date">Loading…</p>
    <time class="clock__time" id="time">
      <span id="hours">00</span><span class="sep">:</span><span id="minutes">00</span><span class="sep">:</span><span id="seconds">00</span>
      <span class="clock__period" id="period">AM</span>
    </time>
  </main>
  <script type="module" src="./script01.js"></script>
</body>
</html>
